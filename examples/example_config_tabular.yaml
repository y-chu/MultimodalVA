# Declarative YAML config — unimodal tabular.
# Run with:  multimodalva run examples/example_config_tabular.yaml

task: tabular
data: demo                            # "demo" = built-in synthetic data; or give a CSV/Parquet path
label: cause_of_death
model: lightgbm                       # catboost | lightgbm | xgboost | random_forest | mlp | svm | knn | ...
output_dir: runs/yaml/tabular_lightgbm

# Feature selection: a regex, an explicit list, or "auto".
features: "re:^i\\d{3}[a-zA-Z]$"
# features: [i019a, i022e, i077o]     # or list them explicitly
encode_categoricals: ordinal

optimize: true
n_trials: 40
metric: f1_macro

# Row filtering and fixed external splits also work here:
# filters:
#   age_grp3: adult
# split: /path/to/splits.json
# id_col: record_id
