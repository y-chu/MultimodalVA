[build-system]
# setuptools>=68 bundles its own distutils, required for Python 3.12+
# (stdlib distutils was removed in Python 3.12).
# >=77 is what understands the PEP 639 `license = "MIT"` SPDX expression below;
# an older setuptools would silently fall back to the deprecated License field.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodalva"
version = "0.1.0"
description = "Cause of death classification using text and tabular data from verbal autopsies"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Yue Chu", email = "ychu612@gmail.com"},
]
keywords = [
    "verbal autopsy",
    "cause of death",
    "clinical NLP",
    "multimodal learning",
    "health surveillance",
    "global health",
    "BERT",
    "transformers",
    "medical AI",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    # torch 2.1: first release with Python 3.12 wheels (Oct 2023).
    "torch>=2.1",
    # transformers 4.38–4.x: required for Python 3.12.2 compatibility;
    # 5.x not yet tested/supported.
    "transformers>=4.38,<5",
    # tokenizers 0.15: required for Python 3.12 wheels and BlueBERT slow tokenizer.
    "tokenizers>=0.15",
    # accelerate is required by transformers Trainer (since ~4.31).
    # Without it, `from transformers import Trainer` raises ModuleNotFoundError.
    # accelerate 0.26: first release with Python 3.12 wheels (Nov 2023).
    "accelerate>=0.26",
    # datasets 2.14: pure Python, compatible with 3.12+.
    "datasets>=2.14",
    # scikit-learn: 1.3.2 is the first release with official 3.12 classifiers.
    # scikit-learn 1.3.x requires numpy<2.0 (Python 3.12 only).
    # scikit-learn 1.5+ supports numpy>=2.0 (required for Python 3.13).
    "scikit-learn>=1.3.2; python_version<'3.13'",
    "scikit-learn>=1.5; python_version>='3.13'",
    # pandas 2.1: first release with official 3.12 classifiers (Aug 2023).
    "pandas>=2.1",
    # numpy: Python 3.12 uses numpy 1.26+ (first 3.12 wheels, Sep 2023).
    # <2 cap on 3.12: compiled C extensions (catboost, scipy, pyinsilicova)
    # built against NumPy 1.x ABI raise ImportError with NumPy 2.x.
    # Python 3.13 requires numpy>=2.0 — numpy 1.x has no 3.13 wheels.
    "numpy>=1.26,<2; python_version<'3.13'",
    "numpy>=2.0; python_version>='3.13'",
    # scipy: transitive dep of scikit-learn and lightgbm.
    # <1.14 was compiled against NumPy 1.x; 1.14 added NumPy 2.x support.
    # Python 3.13 requires scipy>=1.14 (first release with working 3.13 wheels;
    # earlier 3.13 wheels have a broken _propack Cython extension that raises
    # ImportError: cannot import name '_spropack').
    "scipy>=1.11; python_version<'3.13'",
    "scipy>=1.14; python_version>='3.13'",
    # optuna 3.4: first release with Python 3.12 classifiers (Nov 2023).
    "optuna>=3.4",
    # Ray Tune, and the three packages that were only ever here for it, moved to
    # the [ray] extra on 2026-09-27 — see that extra for the reasoning and the
    # measurements. Nothing in the package imports ray, grpcio or protobuf at
    # module level, so a Ray-less install is fully functional on the Optuna
    # backend and `Optimize(backend="auto")` resolves to Optuna when ray is absent.
    # joblib 1.3: pure Python, compatible with 3.12.
    "joblib>=1.3",
    # PyYAML: the CLI reads YAML config files (`multimodalva run experiment.yaml`),
    # a documented entry point, so it is declared rather than relied on as a
    # transitive dependency of transformers / datasets / optuna / accelerate.
    "pyyaml>=5.1",
    # matplotlib 3.8: first release to drop distutils (removed in 3.12) and
    # officially support Python 3.12 (Sep 2023). 3.7 fails on 3.12.
    "matplotlib>=3.8",
    # seaborn 0.13: first release to support Python 3.12 (Sep 2023).
    # 0.12 depended on deprecated matplotlib APIs that 3.8 removed.
    "seaborn>=0.13",
    # adjustText: scatter-plot label placement (avoids overlaps, draws arrows).
    # Pure Python, no compiled deps. Used by csmf_scatterplot() in results/.
    "adjustText>=0.8",
    # sentencepiece: required by models with SentencePiece tokenizers
    # (e.g. BlueBERT, T5, XLNet, DeBERTa-v2). transformers will raise
    # ImportError at tokenizer load time if this is missing.
    "sentencepiece>=0.1.99",
    # Gradient-boosting backends. In core rather than an extra because they are
    # the strongest tabular models in this package and the three most likely to
    # be wanted; unlike AutoGluon they add no constraint on torch/transformers.
    # lightgbm 4.1: first release with Python 3.12 wheels (Oct 2023).
    "lightgbm>=4.1",
    # xgboost 3.0: NumPy 2.x support, Python 3.12/3.13 wheels, and the first
    # release whose saved boosters load in every later 3.x — which matters here
    # because `predict_from_pretrained()` loads artifacts trained elsewhere.
    #
    # No upper bound, deliberately. xgboost's tree construction is not bit-stable
    # across minor releases: with subsample or colsample_bytree below 1 — the
    # regime a tuned model usually lands in — the same data, folds, seed and
    # hyperparameters fitted by 3.0.2 and by 3.1.3 were measured to differ by up
    # to 0.30 in predicted probability, enough to move 6% of top-1 labels. That is
    # a property of xgboost, not something a dependency range can fix: any range
    # wide enough to install permits some drift, and a range narrow enough to
    # prevent it makes the package uninstallable as soon as the next release
    # lands. Reproducing a specific saved run is an environment question — record
    # the versions (`pip freeze`) alongside the run and reinstall them — and the
    # FAQ says so under "How do I make a run reproducible?".
    "xgboost>=3.0",
    # catboost 1.2.2: first release with Python 3.12 wheels (Dec 2023);
    # compiled against NumPy 1.x, compatible with the numpy<2 cap above.
    "catboost>=1.2.2",
]

[project.optional-dependencies]
# --- LoRA fine-tuning (parameter-efficient text training) ---
# Install with: pip install multimodalva[lora]
lora = ["peft>=0.7"]

# --- Ensemble strategy 2: AutoGluon AutoMM feature fusion ---
# Install with: pip install multimodalva[feature_fusion]
# AutoGluon MultiModal currently used/tested in this project.
# Keep these companion constraints explicit because AutoGluon tightens the
# supported torch / transformers / accelerate window more than the base text
# stack does. This avoids under-constrained feature-fusion environments.
feature_fusion = [
    "autogluon.multimodal>=1.5,<1.6",
    # AutoGluon 1.5 requires numpy<2.4; the core deps allow numpy>=2.0 with no
    # upper bound on Python 3.13, so without this an otherwise-valid environment
    # resolves to numpy 2.4+ and AutoGluon fails its own import check.
    "numpy<2.4",
    "torch>=2.6,<2.10",
    "transformers>=4.51,<4.58",
    "accelerate>=0.34,<2.0",
]

# --- Distributed / parallel hyperparameter search ---
# Install with: pip install multimodalva[ray]
#
# Only needed to run a search with Optimize(backend="ray"), which trains trials
# in parallel across the CPUs, GPUs or cluster nodes Ray can see. Without this
# extra the package is complete: every pipeline runs, and a search runs on the
# Optuna backend (which is what produced every result in the paper).
# `Optimize(backend="auto")` checks whether ray is importable and resolves to
# Optuna when it is not, warning if the machine looks like one where Ray would
# have paid off (a CUDA GPU or a SLURM allocation).
#
# Why an extra rather than core (measured 2026-09-27, ray 2.44.1):
#   - 363 MB installed, more than torch (330 MB): ray 192 MB, pyarrow 131 MB,
#     grpcio 34 MB. Every user paid that for a backend most never run.
#   - It takes the `protobuf<5` ceiling out of the core dependency set. That pin
#     is this project's, not Ray's (ray asks only for protobuf>=3.15.3), and it
#     is the most conflict-prone line here — it is what made the install
#     unresolvable when the opentelemetry-* pins were present.
#   - ray is a core dependency no longer able to break `pip install multimodalva`
#     for users who never search with it.
# What this extra does NOT save: `[feature_fusion]` pulls ray in regardless, via
# autogluon.multimodal -> autogluon.core[raytune] -> ray[default,tune].
#
# Version window: the floor is unchanged from when this was core (2.9, the first
# release with official Python 3.12 support). The <2.53 ceiling matches
# autogluon.core[raytune]'s own `ray[default,tune]>=2.43,<2.53`, so [ray] and
# [feature_fusion] resolve together instead of pip having to backtrack — and it
# keeps Ray inside the 2.x API surface that utils/ray_compat.py shims.
ray = [
    "ray[tune]>=2.9,<2.53",
    # Required by Ray Tune's OptunaSearch, which is the search algorithm the Ray
    # backend drives. Plain optuna does not need it.
    "optuna-integration>=3.4",
    # grpcio is NOT declared by ray (checked against 2.44.1) and nothing in this
    # package imports it; Ray's gRPC use is through its bundled C++ core, and a
    # too-old system grpcio has broken Ray clusters before. >=1.42.0 is the
    # Python 3.10+ minimum. Drop it only after a clean-install test of a real
    # Ray run.
    "grpcio>=1.42.0",
    # Required by grpcio and by ray serialisation. >=3.20.3 is ray 2.9+'s own
    # minimum; <5 avoids an untested major bump. Kept here rather than in core so
    # this ceiling only constrains environments that actually run Ray.
    "protobuf>=3.20.3,<5",
]

# --- Everything optional, in one install ---
# pip install "multimodalva[all]"
# The recommended install when disk and environment constraints allow: it adds
# LoRA, the Ray search backend and AutoGluon feature fusion on top of the core
# pipelines.
# Note: InSilicoVA is not included, and is not supported yet (a v1 item).
# `pyinsilicova` does not install on the Python this package requires (>=3.12),
# and it cannot train a probbase against a study's own cause list — native
# causes only. Run InSilicoVA separately and evaluate its predictions through
# `results`; the `model_name="insilicova"` hook in the stacking code is
# unfinished scaffolding, not a feature.
all = [
    "peft>=0.7",
    # The [ray] extra, inlined (PEP 621 has no way to reference another extra).
    # Keep in step with [ray] above.
    "ray[tune]>=2.9,<2.53",
    "optuna-integration>=3.4",
    "grpcio>=1.42.0",
    "protobuf>=3.20.3,<5",
    "autogluon.multimodal>=1.5,<1.6",
    "numpy<2.4",
    "torch>=2.6,<2.10",
    "transformers>=4.51,<4.58",
    "accelerate>=0.34,<2.0",
]

# --- Contributors only: what `pytest` needs ---
# Not required to use the package. Kept as an extra so CI and humans install the
# same thing from one declaration (.github/workflows/tests.yml uses it too).
dev = ["pytest"]

[project.scripts]
# Installs the `multimodalva` CLI: `multimodalva run --task text --data ...`
multimodalva = "multimodalva.cli:main"

[project.urls]
Homepage = "https://github.com/y-chu/MultimodalVA"
Repository = "https://github.com/y-chu/MultimodalVA"
# The FAQ is the entry point that renders on GitHub; docs/index.html is the
# generated API reference, which GitHub serves as source rather than as a page.
Documentation = "https://github.com/y-chu/MultimodalVA/blob/main/FAQ.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["multimodalva*"]

# qdesc.csv and qdesc_who2016.csv are loaded at runtime by
# multimodalva.ensemble.data_fusion.load_qdesc() and by
# multimodalva.datasets. They must ship with the wheel.
[tool.setuptools.package-data]
multimodalva = ["utils/*.csv", "py.typed"]
