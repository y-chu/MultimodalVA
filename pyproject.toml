[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "multimodalva"
version = "0.1.0"
description = "Cause of death classification using text and tabular data from verbal autopsies"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0",
    "transformers>=4.35",
    "datasets>=2.14",
    "scikit-learn>=1.3",
    "pandas>=1.5",
    "numpy>=1.24",
    "optuna>=3.3",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.optional-dependencies]
tabular = [
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "catboost>=1.2",
]
lora = ["peft>=0.6"]
feature_fusion = ["autogluon.multimodal>=1.0"]
ray = ["ray[tune]>=2.7", "optuna-integration>=3.3"]
dev = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/y-chu/MultimodalVA"
Repository = "https://github.com/y-chu/MultimodalVA"
Documentation = "https://github.com/y-chu/MultimodalVA/blob/main/docs/index.html"

[tool.setuptools.packages.find]
where = ["."]
include = ["multimodalva*"]
