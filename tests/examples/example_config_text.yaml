# Interface 3 of 3 — declarative YAML config (unimodal text).
# Run with:  multimodalva run tests/examples/example_config_text.yaml
# Every key is a multimodalva.run() argument. CLI flags, if also given,
# override values here.

task: text
data: demo                            # "demo" = built-in synthetic data; or give a CSV/Parquet path
label: cause_of_death
text_col: narrative
model: bluebert                       # alias / HF id / local dir / remote key (roberta-pm)
output_dir: runs/yaml/text_bluebert

optimize: true
n_trials: 20
metric: f1_macro

# Advanced knobs pass straight through to TextClassifier.run():
use_lora: false
use_cv: true
n_cv_folds: 3

# Publish to the Hugging Face Hub after training (needs `huggingface-cli login`):
# push_to_hub: true
# hub_repo_id: your-username/va-text-bluebert
# hub_private: true
